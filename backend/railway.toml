[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'if [ \"$RAILWAY_SERVICE_NAME\" = \"worker\" ]; then python -m app.worker; else alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT; fi'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
